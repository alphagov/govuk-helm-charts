{{ if .Values.enableCron }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: govuk-synthetic-test-app-cronjob
  namespace: apps
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
    kubernetes.io/description: >
      This cronjob runs synthetic tests against GOV.UK cluster using a Ginkgo test framework.

      The tests check that apps can be deployed through the deployment pipeline
spec:
  schedule: "0,30 * * * *"
  jobTemplate:
    metadata:
      labels:
        app: govuk-synthetic-test-app-cronjob
        app.kubernetes.io/arch: arm64
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: govuk-synthetic-test-app-cronjob
            app.kubernetes.io/arch: arm64
        spec:
          serviceAccountName: synthetic-test-assumer
          restartPolicy: Never
          containers:
            - name: govuk-synthetic-test-app-cronjob
              image: "172025368201.dkr.ecr.eu-west-1.amazonaws.com/github/alphagov/govuk/govuk-synthetic-test-app:{{ .Values.image_tag }}"
              imagePullPolicy: Always
              env:
                - name: PROMETHEUS_PUSHGATEWAY_URL
                  value: "http://prometheus-pushgateway.monitoring.svc.cluster.local:9091"
                - name: GITHUB_PEM_STR
                  valueFrom:
                    secretKeyRef:
                      key: govuk_synthetic-test-app_github_pem_str
                      name: synthetic-test-app-github
                - name: GITHUB_INSTALL_ID
                  valueFrom:
                    secretKeyRef:
                      key: govuk_synthetic-test-app_github_install_id
                      name: synthetic-test-app-github
                - name: GITHUB_APP_ID
                  valueFrom:
                    secretKeyRef:
                      key: govuk_synthetic-test-app_github_app_id
                      name: synthetic-test-app-github
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          tolerations:
            - key: arch
              operator: Equal
              value: arm64
              effect: NoSchedule
{{ end }}
