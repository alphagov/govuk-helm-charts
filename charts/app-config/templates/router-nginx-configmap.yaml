apiVersion: v1
kind: ConfigMap
metadata:
  name: draft-router-nginx-conf
  labels:
    {{- include "app-config.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
  nginx.conf: |-
    {{- include "app-config.router-nginx-config" ( mergeOverwrite . ( dict "Stack" "draft" ) ) | nindent 4 }}
  robots.txt: |-
      User-agent: *
      Disallow: /
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: live-router-nginx-conf
  labels:
    {{- include "app-config.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
  humans.txt: |-
    {{ $.Files.Get "humans.txt" | nindent 4 }}
    {{- if eq .Values.govukEnvironment "integration" }}
      {{- $globPath := printf "humans/*-%s.txt"  (now | date "2006-01-02") -}}
      {{- range $path, $_ := .Files.Glob $globPath }}
        {{ $.Files.Get $path | nindent 4 }}
      {{- end }}
    {{- end }}
  heroes.txt: |-
    {{- if eq .Values.govukEnvironment "integration" }}
      {{- $c := 0 }}
      {{- range $path, $_ := .Files.Glob ("humans/*.txt") }}
        {{- $c = add1 $c }}
      {{- end }}
      {{- $randomNumber := randInt 0 (int $c) }}
      {{- $c := 0 }}
      {{- range $potential_path, $_ := .Files.Glob ("humans/*.txt") }}
        {{- if eq $c $randomNumber }}
    Random humans.txt from {{ $potential_path }}:
          {{ $.Files.Get $potential_path | nindent 4 }}
        {{- end }}
        {{- $c = add1 $c }}
      {{- end }}
    {{- end }}

  nginx.conf: |-
    {{- include "app-config.router-nginx-config" ( mergeOverwrite . ( dict "Stack" "live" ) ) | nindent 4 }}
  opensearch.xml: |-
    {{- $.Files.Get "opensearch.xml" | nindent 4 }}
  robots.txt: |-
    {{- if eq .Values.govukEnvironment "production" }}
      {{- $.Files.Get "www-production-robots.txt" | nindent 4 }}
    {{- else }}
      User-agent: *
      Disallow: /
    {{- end }}
