apiVersion: v1
kind: ServiceAccount
metadata:
  name: whitehall-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: whitehall-admin-emergency-banner-manager
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["govuk-apps-emergency-banner"]
  verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: whitehall-admin-emergency-banner-manager-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: whitehall-admin-emergency-banner-manager
subjects:
  - kind: ServiceAccount
    name: whitehall-admin
