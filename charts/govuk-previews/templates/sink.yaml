# A stand-in for dependencies a preview's core stack leaves out (see
# `full_stack_only` in govuk-preview-app's own config/govuk_apps.yml) -
# e.g. Publishing API always pushes content to a live and a draft Content
# Store, and has no setting to stop it, so in a core stack it pushes to
# this instead. Every request gets an empty 200, and nothing is kept, so
# previews sharing it can't see or affect each other through it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sink
  namespace: previews
data:
  default.conf: |
    server {
      listen 8080;
      location / {
        default_type application/json;
        return 200 '{}';
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: sink
  namespace: previews
spec:
  selector:
    app.kubernetes.io/name: previews-sink
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sink
  namespace: previews
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: previews-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: previews-sink
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # The unprivileged variant listens on 8080 and runs as a non-root
          # user, as the namespace's `restricted` Pod Security requires.
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: config
          configMap:
            name: sink
