# Adds a service account for Whitehall in the previews namespace
# which allows it to control the same govuk-apps-emergency-banner configMap
# that we want it to use in production.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: whitehall-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: whitehall-admin-emergency-banner-manager
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["govuk-apps-emergency-banner"]
  verbs: ["get", "update"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: whitehall-admin-emergency-banner-manager-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: whitehall-admin-emergency-banner-manager
subjects:
  - kind: ServiceAccount
    name: whitehall-admin
