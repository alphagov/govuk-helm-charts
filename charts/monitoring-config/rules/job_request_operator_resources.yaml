# yamllint disable rule:line-length
groups:
  - name: JobRequestOperatorResources
    rules:
      - alert: JobRequestOperatorCurrentMalformed
        expr: >
          job_request_current_malformed > (avg_over_time(job_request_current_malformed[1h]) * 2)
          and job_request_current_malformed > 2
        for: 15m
        labels:
          severity: warning
          destination: generic-slack-platform-engineering
        annotations:
          summary: "[Job Request Operator] Unusual amount job requests that are 'malformed'"
          description: |-
            The Job Request Operator is seeing a spike in the number of malformed job requests

            `kubectl get jr -A`

      - alert: JobRequestOperatorReviewCurrentMalformed
        expr: >
          job_request_review_current_malformed > (avg_over_time(job_request_review_current_malformed[1h]) * 2)
          and job_request_review_current_malformed > 2
        for: 15m
        labels:
          severity: warning
          destination: generic-slack-platform-engineering
        annotations:
          summary: "[Job Request Operator] Unusual amount job request reviews that are 'malformed'"
          description: |-
            The Job Request Operator is seeing a spike in the number of malformed job request reviews

            `kubectl get jrr -A`

      - alert: JobRequestOperatorReviewCurrentNotFound
        expr: >
          job_request_review_current_not_found > (avg_over_time(job_request_review_current_not_found[1h]) * 2)
          and job_request_review_current_not_found > 2
        for: 15m
        labels:
          severity: warning
          destination: generic-slack-platform-engineering
        annotations:
          summary: "[Job Request Operator] Unusual amount job request reviews that are 'not_found' by the API server"
          description: |-
            The Job Request Operator is seeing a spike in the number of not found job request reviews

            `kubectl get jrr -A`

      - alert: JobRequestOperatorReviewCurrentConflict
        expr: >
          job_request_review_current_conflict > (avg_over_time(job_request_review_current_conflict[1h]) * 2)
          and job_request_review_current_conflict > 2
        for: 15m
        labels:
          severity: warning
          destination: generic-slack-platform-engineering
        annotations:
          summary: "[Job Request Operator] Unusual amount job request reviews that are in 'conflict'"
          description: |-
            The Job Request Operator is seeing a spike in the number of job request reviews in conflict

            `kubectl get jrr -A`

      - alert: JobRequestOperatorErrorGettingJR
        expr: >
          rate(job_request_get_error_total[5m]) > (avg_over_time(rate(job_request_get_error_total[5m])[1h:5m]) * 2)
          and rate(job_request_get_error_total[5m]) > 0.05
        for: 15m
        labels:
          severity: warning
          destination: generic-slack-platform-engineering
        annotations:
          summary: "[Job Request Operator] Error getting job request from API server"
          description: |-
            The Job Request Operator is unable to get the job request from the k8s API server

            `kubectl get jr {{ $labels.namespaced_name }}`

      - alert: JobRequestOperatorErrorGettingJRR
        expr: >
          rate(job_request_review_getting_review_error_total[5m]) > (avg_over_time(rate(job_request_review_getting_review_error_total[5m])[1h:5m]) * 2)
          and rate(job_request_review_getting_review_error_total[5m]) > 0.05
        for: 15m
        labels:
          severity: warning
          destination: generic-slack-platform-engineering
        annotations:
          summary: "[Job Request Operator] Error getting job request review from API server"
          description: |-
            The Job Request Operator is unable to get the job request review from the k8s API server

            `kubectl get jrr {{ $labels.namespaced_name }}`

# yamllint enable rule:line-length
