rule_files:
  - deployment_pipeline_test_failure.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_schedule_time{namespace="apps", cronjob="govuk-synthetic-test-app-cronjob"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: DeploymentPipelineTestDidNotRun
        exp_alerts: []

      - eval_time: 36m
        alertname: DeploymentPipelineTestDidNotRun
        exp_alerts:
          - exp_labels:
              severity: warning
              destination: generic-slack-platform-engineering
              cronjob: govuk-synthetic-test-app-cronjob
              namespace: apps
            exp_annotations:
              summary: "[DID NOT RUN] No Deployment pipeline tests have ran in the past 35 mins"
              description: |-
                The deployment pipeline is broken, the tests should run every 30 mins, please investigate immediately:

                `kubectl get job -l app=govuk-synthetic-test-app-cronjob -n apps`

  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 1m
        alertname: DeploymentPipelineTestDidNotRun
        exp_alerts:
          - exp_labels:
              severity: warning
              destination: generic-slack-platform-engineering
              cronjob: govuk-synthetic-test-app-cronjob
              namespace: apps
            exp_annotations:
              summary: "[DID NOT RUN] No Deployment pipeline tests have ran in the past 35 mins"
              description: |-
                The deployment pipeline is broken, the tests should run every 30 mins, please investigate immediately:

                `kubectl get job -l app=govuk-synthetic-test-app-cronjob -n apps`

  - interval: 1m
    input_series:
      - series: 'deployment_pipeline_test_success{environment="production"}'
        values: "0"
      - series: 'deployment_pipeline_test_success{environment="staging"}'
        values: "0"
      - series: 'deployment_pipeline_test_success{environment="integration"}'
        values: "0"

    alert_rule_test:
      - alertname: DeploymentPipelineTestFailure
        eval_time: 1m
        exp_alerts:
          - exp_labels:
              severity: warning
              destination: generic-slack-platform-engineering
              environment: production
            exp_annotations:
              summary: "[PRODUCTION] Deployment pipeline tests are failing"
              description: |-
                The deployment pipeline is broken, please investigate immediately:

                `kubectl logs govuk-synthetic-test-app-cronjob -n apps`

          - exp_labels:
              severity: warning
              destination: generic-slack-platform-engineering
              environment: staging
            exp_annotations:
              summary: "[STAGING] Deployment pipeline tests are failing"
              description: |-
                The deployment pipeline is broken, please investigate immediately:

                `kubectl logs govuk-synthetic-test-app-cronjob -n apps`

          - exp_labels:
              severity: warning
              destination: generic-slack-platform-engineering
              environment: integration
            exp_annotations:
              summary: "[INTEGRATION] Deployment pipeline tests are failing"
              description: |-
                The deployment pipeline is broken, please investigate immediately:

                `kubectl logs govuk-synthetic-test-app-cronjob -n apps`

  - interval: 1m
    start_timestamp: 2000
    input_series:
      - series: 'kube_job_status_start_time{job_name="govuk-synthetic-test-app-cronjob-long"}'
        values: "500+0x25"
      - series: 'kube_job_status_active{job_name="govuk-synthetic-test-app-cronjob-long"}'
        values: "1+0x25"

    alert_rule_test:
      - alertname: DeploymentPipelineTestJobTakingTooLong
        eval_time: 1m
        exp_alerts:
          - exp_labels:
              severity: warning
              destination: generic-slack-platform-engineering
              job_name: govuk-synthetic-test-app-cronjob-long
            exp_annotations:
              summary: "[TAKING TOO LONG] The Deployment pipeline tests are taking > 25 mins"
              description: |-
                The deployment pipeline currently running job is taking too long, the tests run every 30 mins and should finish within 20 mins, please investigate immediately:

                `kubectl logs govuk-synthetic-test-app-cronjob-long -n apps`
