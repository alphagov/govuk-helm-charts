groups:
  - name: SearchApiDegradationAlerts
    interval: 1m
    rules:
      - record: search_api:search_requests:increase5m
        expr: |
          sum by (status) (
            increase(
              http_requests_total{
                namespace="apps",
                job="search-api",
                search_api_endpoint="search"
              }[5m]
            )
          )
      - record: search_api:successful_search_requests:ratio_increase5m
        expr: |
          (
            sum (search_api:search_requests:increase5m{status!~"(4..|5..|-1)"})  #  exclude bad requests and server errors
            /
            sum (search_api:search_requests:increase5m{status!~"(4..)"}) > 0  # exclude bad requests
          ) or vector(1)
      - record: search_api:search_requests:increase1h
        expr: |
          sum by (status) (
            increase(
              http_requests_total{
                namespace="apps",
                job="search-api",
                search_api_endpoint="search"
              }[1h]
            )
          )
      - record: search_api:successful_search_requests:ratio_increase1h
        expr: |
          (
            sum (search_api:search_requests:increase1h{status!~"(4..|5..|-1)"})  #  exclude bad requests and server errors
            /
            sum (search_api:search_requests:increase1h{status!~"(4..)"}) > 0  # exclude bad requests
          ) or vector(1)


      - alert: SearchApiSearchSuccessRateDegradedAcute
        expr: search_api:successful_search_requests:ratio_increase5m < 0.99
        labels:
          severity: critical
          destination: slack-search-team
        annotations:
          summary: "Search API: Search success rate degraded (acute)"
          grafana_path: >-
            d/emvd8hx/gov-uk-search-api-v1?orgId=1&from=now-24h&to=now&timezone=browser&viewPanel=panel-7
          runbook_url: >-
            https://docs.publishing.service.gov.uk/manual/search-api-alerts-and-monitoring.html
          description: >-
            5 minute rolling success rate for search requests to search-api has dropped below 99%.
      - alert: SearchApiSearchSuccessRateDegradedMid
        expr: search_api:successful_search_requests:ratio_increase1h < 0.999
        labels:
          severity: critical
          destination: slack-search-team
        annotations:
          summary: "Search API: Search success rate degraded (mid)"
          grafana_path: >-
            d/emvd8hx/gov-uk-search-api-v1?orgId=1&from=now-24h&to=now&timezone=browser&viewPanel=panel-7
          runbook_url: >-
            https://docs.publishing.service.gov.uk/manual/search-api-alerts-and-monitoring.html
          description: >-
            1 hour rolling success rate for search requests to search-api has dropped below 99.9%.

  - name: SearchApiOpensearchAlerts
    rules:
      - alert: SearchApiOpensearchClusterStatusUnkUnav
        expr: search_api_opensearch_status == 3
        for: 5m
        labels:
          severity: critical
          destination: slack-search-team
        annotations:
          summary: Opensearch cluster status is UNKNOWN or UNAVAILABLE
          grafana_path: >-
            d/emvd8hx/gov-uk-search-api-v1?from=now-24h&to=now&timezone=browser&var-client_error_status=$__all&var-server_error_status=$__all&dtab=Users-get-search-results-quickly&viewPanel=panel-28
          runbook_url: >-
            https://docs.publishing.service.gov.uk/manual/search-api-alerts-and-monitoring.html#opensearch-alerts
          description: >-
            The state of the Opensearch cluster used by Search API is unknown.
      - alert: SearchApiOpensearchClusterStatusRed
        expr: search_api_opensearch_status == 2
        for: 5m
        labels:
          severity: critical
          destination: slack-search-team
        annotations:
          summary: Opensearch cluster status is RED
          grafana_path: >-
            d/emvd8hx/gov-uk-search-api-v1?from=now-24h&to=now&timezone=browser&var-client_error_status=$__all&var-server_error_status=$__all&dtab=Users-get-search-results-quickly&viewPanel=panel-28
          runbook_url: >-
            https://docs.publishing.service.gov.uk/manual/search-api-alerts-and-monitoring.html#opensearch-alerts
          description: >-
            The Opensearch cluster used by Search API is in RED state.
            Some primary shards are unavailable and search indexing may fail.
      - alert: SearchApiOpensearchClusterStatusYellow
        expr: search_api_opensearch_status == 1
        for: 30m
        labels:
          severity: warning
          destination: slack-search-team
        annotations:
          summary: Opensearch cluster status is YELLOW
          grafana_path: >-
            d/emvd8hx/gov-uk-search-api-v1?from=now-24h&to=now&timezone=browser&var-client_error_status=$__all&var-server_error_status=$__all&dtab=Users-get-search-results-quickly&viewPanel=panel-28
          runbook_url: >-
            https://docs.publishing.service.gov.uk/manual/search-api-alerts-and-monitoring.html#opensearch-alerts
          description: >-
            The Opensearch cluster used by Search API is in YELLOW state.
            Replica shards are not allocated. The cluster is still functional
            but resilience is reduced.
      - alert: SearchApiOpensearchDiskSpaceLow
        expr: search_api_opensearch_disk_space < 0.30
        for: 15m
        labels:
          severity: warning
          destination: slack-search-team
        annotations:
          summary: Opensearch disk space low
          grafana_path: >-
            d/emvd8hx/gov-uk-search-api-v1?from=now-24h&to=now&timezone=browser&var-client_error_status=$__all&var-server_error_status=$__all&dtab=Users-get-search-results-quickly&viewPanel=panel-29
          runbook_url: >-
            https://docs.publishing.service.gov.uk/manual/search-api-alerts-and-monitoring.html#opensearch-alerts
          description: >-
            Opensearch node {{ $labels.node }} has less than 30% disk space
            remaining. Consider increasing storage capacity.
      - alert: SearchApiOpensearchDiskSpaceCritical
        expr: search_api_opensearch_disk_space < 0.10
        for: 10m
        labels:
          severity: critical
          destination: slack-search-team
        annotations:
          summary: Opensearch disk space critical
          grafana_path: >-
            d/emvd8hx/gov-uk-search-api-v1?from=now-24h&to=now&timezone=browser&var-client_error_status=$__all&var-server_error_status=$__all&dtab=Users-get-search-results-quickly&viewPanel=panel-29
          runbook_url: >-
            https://docs.publishing.service.gov.uk/manual/search-api-alerts-and-monitoring.html#opensearch-alerts
          description: >-
            Opensearch node {{ $labels.node }} has less than 10% disk space
            remaining. Increase storage capacity as a matter of priority.

  - name: SearchApiCronjobs
    rules:
      - alert: CronjobFailed => CronjobSuccessThreshold
        # Set alert to trigger when last successful time is over 50 hours
        expr: >-
          time() -
          kube_cronjob_status_last_successful_time{cronjob="search-api-load-page-traffic"}
          > 180000
        for: 5m
        labels:
          severity: critical
          destination: slack-search-team
        annotations:
          summary: search-api-load-page-traffic cronjob failing
          description: >-
            The cronjob "search-api-load-page-traffic" has not run successfully
            since {{ $value | humanizeTimestamp }}
          cronjob_uri: >-
            applications/search-api?orphaned=false&resource=&node=batch%2FCronJob%2Fapps%2Fsearch-api-load-page-traffic%2F0&tab=logs
